[package]
name = "tendr"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Keep shells, REPLs and long-running jobs alive between tool calls, locally or over SSH"
license = "MIT OR Apache-2.0"
repository = "https://github.com/grumpydevorg/tendr"
readme = "README.md"
default-run = "tendr"
keywords = ["cli", "supervisor", "agent", "process", "session"]
categories = ["command-line-utilities", "development-tools"]
# Whitelist the crate package: public source, the embedded skill, the guide the
# binary include_str!s, README, and licenses. Keep src/bin test helpers and
# examples/ (development aids such as dump-recording) out of the package so
# crates.io installs only `tendr`, while local builds can still auto-discover
# them.
include = [
    "/src/*.rs",
    "/src/commands/**/*",
    "/src/embedded/**/*",
    "/src/model/**/*",
    "/src/platform/**/*",
    "/src/recording/**/*",
    "/src/sidecar/**/*",
    "/docs/guide.md",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

# The crate, the library (`use tendr::…`) and the binary are all `tendr`.
[lib]
name = "tendr"

[[bin]]
name = "tendr"
path = "src/main.rs"

# `cargo binstall tendr` fetches the prebuilt binary from GitHub releases.
# Asset naming here must match what release.yml uploads: tendr-<target>.tar.gz
# containing the `tendr` binary at the archive root.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
humantime = "2"
shell-words = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process", "param", "termios"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
base64 = "0.22.1"
crc32c = "0.6.8"

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"
proptest = "1.10.0"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
