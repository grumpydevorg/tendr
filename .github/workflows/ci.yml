name: ci

# Regression gate on every PR and push to main, across all supported platforms.
# The release workflow only *builds* on a tag; this is what actually blocks
# regressions — including native Windows (x64 + ARM64). Make these checks
# required via branch protection once they are green.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
        # Native pinned DuckDB CLI per lane so the analytics tests actually run
        # everywhere (see TENDR_REQUIRE_DUCKDB_TESTS below).
        include:
          - os: ubuntu-latest
            duckdb_asset: duckdb_cli-linux-amd64.zip
          - os: macos-latest
            duckdb_asset: duckdb_cli-osx-universal.zip
          - os: windows-latest
            duckdb_asset: duckdb_cli-windows-amd64.zip
          - os: windows-11-arm
            duckdb_asset: duckdb_cli-windows-arm64.zip
    env:
      DUCKDB_VERSION: v1.5.2
      # Absence of duckdb must FAIL these lanes, not silently skip -- otherwise a
      # broken install step would turn analytics coverage falsely green.
      TENDR_REQUIRE_DUCKDB_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update
      - name: Install DuckDB CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -o "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb-bin"
          echo "$RUNNER_TEMP/duckdb-bin" >> "$GITHUB_PATH"
      - name: Install DuckDB CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/duckdb/duckdb/releases/download/$env:DUCKDB_VERSION/${{ matrix.duckdb_asset }}"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\duckdb.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\duckdb.zip" -DestinationPath "$env:RUNNER_TEMP\duckdb-bin" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\duckdb-bin"
      - name: Verify DuckDB
        run: duckdb --version
      - name: Test
        # --no-fail-fast so every test binary runs and the log shows the full
        # per-platform failure inventory, not just the first binary to fail.
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Doc tests
        run: cargo test --locked --doc --no-fail-fast

  # `--host` against a real Windows OpenSSH server on this runner, under the
  # default cmd.exe login shell, then Windows PowerShell 5.1, then pwsh 7
  # (tests/cli_remote_windows_ssh.rs). Runner facts this relies on: Server 2025
  # (windows-latest) ships sshd with `AllowGroups administrators "openssh
  # users"`; windows-11-arm has no sshd capability (installing it takes 15+
  # min), so the pinned portable Win32-OpenSSH release is used. Key auth fails for
  # every account under the service, so a dedicated local user logs in by
  # password through SSH_ASKPASS. The remote tendr is this build, on the
  # machine PATH sshd hands its sessions.
  windows-openssh:
    name: windows openssh ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    env:
      TENDR_TEST_WIN_SSH_HOST: tendr-ssh
      TENDR_TEST_WIN_SSH_SCRATCH: C:\tendr-ssh
      # Without the host the tests must fail, not skip to a false green.
      TENDR_REQUIRE_WIN_SSH_TESTS: "1"
      # Pinned, with each zip's SHA-256 from the release's asset digests.
      WIN32_OPENSSH_VERSION: 10.4.0.0p1-Preview
      WIN32_OPENSSH_SHA256_ARM64: d2b1928225479fec9e0c938f527fdb5ed676446cca1bbcc5af84aca1f272842e
      WIN32_OPENSSH_SHA256_Win64: b67ff8becd203502190ec42ac7787c24c2cd3325ed7700485fe7a1c83d2a7957
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update
      - name: Build tendr, test_callback and the tests
        run: cargo test --locked --test cli_remote_windows_ssh --no-run
      - name: Install sshd where it is missing
        shell: pwsh
        run: |
          $sshd = 'C:\Windows\System32\OpenSSH\sshd.exe'
          if (-not (Test-Path $sshd)) {
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'Win64' }
            $zip = "$env:RUNNER_TEMP\openssh.zip"
            Invoke-WebRequest "https://github.com/PowerShell/Win32-OpenSSH/releases/download/$env:WIN32_OPENSSH_VERSION/OpenSSH-$arch.zip" -OutFile $zip
            $want = [Environment]::GetEnvironmentVariable("WIN32_OPENSSH_SHA256_$arch")
            $got = (Get-FileHash $zip -Algorithm SHA256).Hash
            if ($got -ne $want) { throw "OpenSSH-$arch.zip SHA-256 is $got, expected $want" }
            Expand-Archive $zip -DestinationPath 'C:\Program Files\OpenSSH' -Force
            $dir = "C:\Program Files\OpenSSH\OpenSSH-$arch"
            & powershell.exe -ExecutionPolicy Bypass -File "$dir\install-sshd.ps1"
            if ($LASTEXITCODE) { throw "install-sshd.ps1 exited $LASTEXITCODE" }
            $sshd = "$dir\sshd.exe"
          }
          "sshd: $sshd $((Get-Item $sshd).VersionInfo.ProductVersion)"
          "ssh: $((Get-Command ssh).Source)"
      - name: Remote user, tendr on its PATH, ssh client alias
        id: setup
        shell: pwsh
        run: |
          $pw = 'Tz9-' + [guid]::NewGuid().ToString()
          "::add-mask::$pw"
          New-LocalUser -Name tendrssh -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          if (Get-LocalGroup 'OpenSSH Users' -ErrorAction SilentlyContinue) { Add-LocalGroupMember 'OpenSSH Users' tendrssh }
          $ask = "$env:RUNNER_TEMP\askpass.cmd"
          Set-Content $ask "@echo $pw" -Encoding ascii
          "SSH_ASKPASS=$ask", 'SSH_ASKPASS_REQUIRE=force', 'DISPLAY=x' | Add-Content $env:GITHUB_ENV
          $env:SSH_ASKPASS = $ask; $env:SSH_ASKPASS_REQUIRE = 'force'; $env:DISPLAY = 'x'
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
          Set-Content "$env:USERPROFILE\.ssh\config" -Encoding ascii -Value @(
            "Host $env:TENDR_TEST_WIN_SSH_HOST",
            '  HostName localhost',
            '  User tendrssh',
            '  PreferredAuthentications password',
            '  PubkeyAuthentication no',
            '  StrictHostKeyChecking no',
            '  UserKnownHostsFile NUL',
            '  LogLevel ERROR')
          # Both users write here: an injected command would leave a file.
          New-Item -ItemType Directory -Force $env:TENDR_TEST_WIN_SSH_SCRATCH | Out-Null
          icacls.exe $env:TENDR_TEST_WIN_SSH_SCRATCH /grant '*S-1-1-0:(OI)(CI)F' | Out-Null
          $bin = 'C:\tendr-ssh-bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item target\debug\tendr.exe, target\debug\test_callback.exe $bin
          $path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          [Environment]::SetEnvironmentVariable('Path', "$bin;$path", 'Machine')
          Restart-Service sshd
          # The first login creates the remote user's profile. sshd may still
          # be binding just after the restart, so retry briefly.
          for ($i = 1; $i -le 10; $i++) {
            ssh $env:TENDR_TEST_WIN_SSH_HOST 'echo user=%USERNAME% HOME=%HOME% USERPROFILE=%USERPROFILE% & tendr --version'
            if (-not $LASTEXITCODE) { break }
            if ($i -eq 10) { throw "ssh to the remote tendr exited $LASTEXITCODE" }
            Start-Sleep 1
          }
      - name: Tests, cmd.exe login shell
        env:
          TENDR_TEST_WIN_SSH_SHELL: cmd
        run: cargo test --locked --test cli_remote_windows_ssh -- --test-threads=1 --nocapture
      - name: Switch the login shell to PowerShell
        id: powershell
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          if (-not (Test-Path 'HKLM:\SOFTWARE\OpenSSH')) { New-Item 'HKLM:\SOFTWARE\OpenSSH' | Out-Null }
          New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell -PropertyType String -Force `
            -Value "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" | Out-Null
          $v = ssh $env:TENDR_TEST_WIN_SSH_HOST '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -or "$v" -notmatch '^5\.') { throw "the PowerShell 5.1 login shell is not in effect: $v" }
          "login shell: PowerShell $v"
      - name: Tests, PowerShell login shell
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' }}
        env:
          TENDR_TEST_WIN_SSH_SHELL: powershell
        run: cargo test --locked --test cli_remote_windows_ssh -- --test-threads=1 --nocapture
      - name: Switch the login shell to pwsh 7
        id: pwsh
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          if (-not (Test-Path 'HKLM:\SOFTWARE\OpenSSH')) { New-Item 'HKLM:\SOFTWARE\OpenSSH' | Out-Null }
          New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell -PropertyType String -Force `
            -Value "$env:ProgramFiles\PowerShell\7\pwsh.exe" | Out-Null
          $v = ssh $env:TENDR_TEST_WIN_SSH_HOST '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -or "$v" -notmatch '^7\.') { throw "the pwsh 7 login shell is not in effect: $v" }
          "login shell: pwsh $v"
      - name: Tests, pwsh 7 login shell
        if: ${{ !cancelled() && steps.pwsh.outcome == 'success' }}
        env:
          TENDR_TEST_WIN_SSH_SHELL: pwsh
        run: cargo test --locked --test cli_remote_windows_ssh -- --test-threads=1 --nocapture

  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust + components
        run: rustup update stable --no-self-update && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Package (locked)
        run: cargo package --locked --allow-dirty

  # Code under `#[cfg(windows)]` and `#[cfg(unix)]` is only linted on a host of
  # that family, and the native Windows lanes run tests, not clippy -- so
  # Windows-only lint findings (and Unix-only helpers left dead on Windows)
  # reached main unnoticed. `clippy` type-checks without linking, so a Linux
  # runner with the Windows std installed covers both Windows targets cheaply.
  clippy-windows:
    name: clippy windows targets (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust + Windows targets
        run: |
          rustup update stable --no-self-update
          rustup component add clippy
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - name: Clippy (x86_64-pc-windows-msvc)
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Clippy (aarch64-pc-windows-msvc)
        run: cargo clippy --all-targets --locked --target aarch64-pc-windows-msvc -- -D warnings

  # The crate advertises `rust-version = "1.85"` in Cargo.toml and
  # `cargo install tendr` is a documented path, so that is a published
  # contract. Nothing verified it until this job: the code used let-chains,
  # stable only from 1.88, so the advertised minimum could not build the crate
  # at all. A promise nothing executes is not a promise.
  msrv:
    name: msrv (1.85.0, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the build toolchain for every other lane.
      # `+1.85.0` overrides it here, which is the point: this lane must use the
      # advertised minimum, not the version everything else builds with.
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      # `check --all-targets` type-checks tests and benches without running
      # them. MSRV is a compile-time contract -- whether the crate BUILDS on the
      # advertised minimum. Behaviour on that toolchain is not claimed, and the
      # four-platform matrix above already runs the tests on the pinned one.
      - name: Check on the advertised MSRV
        run: cargo +1.85.0 check --locked --all-targets

  doc:
    name: doc (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable --no-self-update
      # Any rustdoc warning -- broken intra-doc link, bad HTML, unresolved
      # reference -- fails the build. deny(rustdoc::broken_intra_doc_links) in
      # lib.rs catches the same class locally; this makes it a required gate.
      - name: Rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps
