name: release

# Cut a release by pushing a version tag, e.g. `git tag v0.2.0 && git push --tags`.
# Builds a per-target binary, packages it as `tendr-<target>.tar.gz` (the
# name `cargo binstall tendr` expects — see [package.metadata.binstall] in
# Cargo.toml), attaches a SHA256 sidecar, attests build provenance (keyless SLSA),
# and uploads everything to a draft GitHub Release for the tag. The release is
# published only after every lane has uploaded, so it is never public with
# assets missing; if a lane fails it stays a draft.
#
# Run `cargo publish` only after the `publish` job is green: `cargo binstall`
# downloads from this release, which 404s while it is a draft.
# Recovery: a failed lane → "Re-run failed jobs" (re-runs the lane, then
# `publish`); a cancelled run → "Re-run all jobs" (the draft is reused). To
# publish by hand after checking all 12 assets:
# `gh release edit <tag> --draft=false --latest`.
#
# Validated by the v0.2.0 and v0.2.1 releases across all six target lanes.
# The first tagged release after an action-version or job-shape change remains
# its live test.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets
  id-token: write # OIDC token for keyless attestation
  attestations: write # write build provenance

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh can't infer the repo from a local
          # git remote — point it at the repo explicitly (the create/view calls
          # are pure API operations, no working tree needed).
          GH_REPO: ${{ github.repository }}
        # Create the draft only when the release does not exist; any other
        # `view` error fails the job instead of making a second draft.
        run: |
          if out=$(gh release view "$GITHUB_REF_NAME" 2>&1); then
            echo "release $GITHUB_REF_NAME exists"
          elif [[ $out == *"release not found"* ]]; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust + target
        run: rustup update stable --no-self-update && rustup target add ${{ matrix.target }}

      - name: Install Zig (for cargo-zigbuild musl cross)
        if: matrix.zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }} --bin tendr
          else
            cargo build --release --target ${{ matrix.target }} --bin tendr
          fi

      - name: Package
        id: pkg
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          archive="tendr-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" "tendr${ext}"
          # sha256sum on Linux/Git-Bash; shasum on macOS.
          (sha256sum "$archive" || shasum -a 256 "$archive") > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.pkg.outputs.archive }}

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.archive }}" \
            "${{ steps.pkg.outputs.archive }}.sha256" \
            --clobber

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
